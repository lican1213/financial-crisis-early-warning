name: Hourly evidence check
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fcews-hourly
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate evidence and alert gate
        id: gate
        run: PYTHONPATH=src python -m fcews.cli
      - name: Persist only changed evidence and state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m 'data: FCEWS evidence transition'
            git push
          fi
      - name: Open candidate issue only on new alert
        if: steps.gate.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "FCEWS candidate alert" --body-file data/ALERT.md
