name: Hourly financial-risk evidence and delivery
on:
  push:
    paths:
      - 'src/fcews/**'
      - '.github/workflows/check.yml'
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fcews-hourly
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Poll and evaluate (fail on lost source coverage)
        id: collect
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.cli --require-healthy
      - name: Persist source observations, candidate outbox, and health diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m 'data: source-dated FCEWS state or health transition'
            git push
          fi
      - name: Idempotent candidate issue delivery and source health incident
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH=src python -m fcews.delivery
          PYTHONPATH=src python -m fcews.bridge
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m 'data: acknowledge GitHub candidate issue receipt'
            git push
          fi
      - name: Treat loss of monitor coverage as operational failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Market data monitoring degraded. See data/health.json and the FCEWS DATA-HEALTH issue."
          exit 2
