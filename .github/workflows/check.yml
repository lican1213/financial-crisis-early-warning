name: Hourly financial-risk evidence and delivery
on:
  push:
    branches:
      - main
    paths:
      - 'src/fcews/**'
      - '.github/workflows/check.yml'
  schedule:
    - cron: '13 * * * *'
    # Secondary best-effort slot reduces but does NOT eliminate missed GitHub cron.
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fcews-hourly
  cancel-in-progress: false
  queue: max
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Queued/retried jobs must read current persisted state, not their original SHA.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Poll and evaluate (fail on lost source coverage)
        id: collect
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.cli --require-healthy
      - name: Persist source observations, candidate outbox, and health diagnostics
        id: persist
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Publish the durable pending candidate before any Issue API request.
          PYTHONPATH=src python -m fcews.bridge
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m 'data: source-dated FCEWS state, outbox and read-only feed'
            git pull --rebase origin main
            git push
          fi
      - name: Idempotent candidate issue delivery and source health incident
        id: delivery
        if: always() && steps.persist.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH=src python -m fcews.delivery
      - name: Republish durable feed and acknowledge any completed Issue delivery
        id: bridge
        if: always() && steps.persist.outcome == 'success'
        run: |
          PYTHONPATH=src python -m fcews.bridge
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m 'data: acknowledge GitHub candidate issue receipt'
            git pull --rebase origin main
            git push
          fi
      - name: Publish operational poll receipt independently of evidence changes
        if: always() && !cancelled() && steps.collect.outcome != ''
        env:
          FCEWS_COLLECT: ${{ steps.collect.outcome }}
          FCEWS_PERSIST: ${{ steps.persist.outcome }}
          FCEWS_BRIDGE: ${{ steps.bridge.outcome }}
          FCEWS_DELIVERY: ${{ steps.delivery.outcome }}
        run: |
          PYTHONPATH=src python -m fcews.heartbeat
          git add data/poll_heartbeat.json
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record poll heartbeat (not market evidence)'
            git pull --rebase origin main
            git push
          fi
      - name: Treat loss of monitor coverage or Issue delivery as operational failure
        if: always() && (steps.collect.outcome == 'failure' || steps.delivery.outcome == 'failure')
        run: |
          echo "::error::Collection or Issue delivery failed. Check health, outbox and heartbeat; not a financial-crisis alert."
          exit 2
