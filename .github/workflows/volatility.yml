name: Daily official volatility term structure (Cboe) and Treasury yield vol
on:
  push:
    paths:
      - 'src/fcews/volatility.py'
      - 'tests/test_volatility.py'
      - '.github/workflows/volatility.yml'
  schedule:
    - cron: '45 0 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fcews-volatility-context
  cancel-in-progress: false
jobs:
  volatility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial fixtures for Cboe term structure and licensed MOVE boundary
        run: PYTHONPATH=src python -m unittest tests.test_volatility -v
      - name: Retrieve official Cboe volatility indexes and CFE settlements; Treasury realized-vol context
        id: fetch
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.volatility
      - name: Persist dated context and diagnostic status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/volatility_context.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: official Cboe volatility term context'
            git pull --rebase origin main
            git push
          fi
      - name: Fail visibly on absent source coverage (never a crisis alarm)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Cboe volatility context coverage degraded; inspect data/volatility_context.json"
          exit 2
