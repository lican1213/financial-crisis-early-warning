name: Daily official leading-indicator research (no crisis alert)
on:
  push:
    branches: [main]
    paths:
      - 'src/fcews/research.py'
      - 'src/fcews/nbs.py'
      - 'src/fcews/nbs_property.py'
      - 'src/fcews/staffing_ir.py'
      - '.github/workflows/research.yml'
      - 'data/research_evidence.json'
  schedule:
    # 09:39 Beijing; best-effort GitHub cron, not an exact-time SLA.
    - cron: '39 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fcews-leading-research
  cancel-in-progress: false
jobs:
  official-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute first-principles source and causality red-team tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_research.py' -v
      - name: Parse official NBS manufacturing PMI release (fail-closed)
        id: nbs
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.nbs
      - name: Audit original NBS 70-city price and real estate developer releases
        id: property
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.nbs_property
      - name: Extract demand metrics from five original recruiting issuer filings
        id: staffing
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.staffing_ir
      - name: Collect US primary-source leading indicators and validate official release ledger
        id: research
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.research
      - name: Persist source-dated research context (never personal portfolio data)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/research_context.json ]; then
            git add data/research_context.json
          fi
          if [ -f data/nbs_pmi_context.json ]; then
            git add data/nbs_pmi_context.json
          fi
          if [ -f data/nbs_property_context.json ]; then
            git add data/nbs_property_context.json
          fi
          if [ -f data/staffing_ir_context.json ]; then
            git add data/staffing_ir_context.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: source-dated leading research context'
            git pull --rebase origin main
            git push
          fi
      - name: Refresh ChatGPT read-only feed AFTER successful research persistence
        if: always()
        run: |
          # Re-read the current main state after the research data commit. This
          # feed is evidence only, never a user alert or crisis authorization.
          git pull --ff-only origin main
          PYTHONPATH=src python -m fcews.bridge
          git add data/chatgpt_feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh non-alert research provenance in ChatGPT feed'
            git pull --rebase origin main
            git push
          fi
      - name: Do not mistake source failure for calm or crisis
        if: steps.research.outcome == 'failure' || steps.nbs.outcome == 'failure' || steps.property.outcome == 'failure' || steps.staffing.outcome == 'failure'
        run: |
          echo "::error::Research sources failed or a release failed validation; no systemic alert generated."
          exit 2
