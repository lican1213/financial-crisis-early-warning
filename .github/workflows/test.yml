name: Risk gates and MOC structural audit
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original-PDF reader
        run: python -m pip install 'pypdf==5.9.0'
      - name: Core decision tests and MOC adversarial lint tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check wiki source, backlinks and MOC coverage
        run: python scripts/wiki_lint.py

      - name: One-time live GitHub schedule API audit (read-only, verification branch only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: PYTHONPATH=src python -m fcews.schedule_health
