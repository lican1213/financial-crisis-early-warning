name: Daily official OFR repo funding context
on:
  schedule:
    - cron: '32 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fcews-hourly
  cancel-in-progress: false
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read official OFR short-term repo series
        id: fetch
        continue-on-error: true
        run: PYTHONPATH=src python -m fcews.stfm
      - name: Record first-seen source metadata
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stfm_context.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: OFR repo funding context'
            git push
          fi
      - name: Mark failed official source fetch clearly
        if: steps.fetch.outcome == 'failure'
        run: exit 2
